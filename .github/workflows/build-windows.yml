name: Build Windows x64 executable

on:
  push:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build and test Windows x64 executable
    runs-on: windows-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry install
          poetry run python -m pip install pytest pyinstaller

      - name: Run tests
        run: poetry run python -m pytest -o addopts=

      - name: Build executable
        run: >-
          poetry run python -m PyInstaller
          --clean
          --noconfirm
          --onefile
          --name jefferson-windows-x64
          jefferson/cli.py

      - name: Verify executable
        run: .\dist\jefferson-windows-x64.exe --help

      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@v5
        with:
          name: jefferson-windows-x64
          path: dist/jefferson-windows-x64.exe
          if-no-files-found: error
